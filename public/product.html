<!doctype html>

  <link rel="icon" type="image/png" href="/assets/icons/isotipo.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">

      <div class="brand">

          <img class="logo-img" src="/assets/icons/logotipo.png" alt="Dulce Mocka">
        </a>
      </div>
      <div class="actions">
        <a class="icon icon-with-img" href="/cart.html" aria-label="Carrito" title="Carrito">
          <img class="ui-icon" src="/assets/icons/carrito.png" alt="Carrito">
        </a>
        <a class="btn outline" href="/login.html">Iniciar sesión</a>
      </div>
    </div>
  </header>

  <main class="container" id="productPage">
    <!-- Contenido renderizado por product.js -->

  <footer class="site-footer">
    <!-- footer estará incluido desde index.html en estilo, pero mantenemos simple copia -->
    <div class="footer-bottom">
      <div class="container">
        <span>© 2026 Dulce Shakes. Todos los derechos reservados.</span>
        <span class="footer-credit">Pagina desarrollada por AIT Group</span>
      </div>
    </div>

  <script src="/js/notificaciones.js"></script>
